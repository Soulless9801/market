name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-progress runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The Python suite drives the TypeScript dataset exporter, inference client
      # and Vite dev/preview servers, so it needs the Node toolchain as well.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Installs the interpreter from .python-version and the locked, CPU-only
      # torch build that pyproject.toml selects for Linux.
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      # Includes tests/python/test_end_to_end.py, which is what npm run validate:ml runs.
      - run: uv run --locked pytest -q
